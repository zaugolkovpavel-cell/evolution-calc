<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эмулятор Паскалины</title>
    <style>
        body { background: #2c2c2c; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: 'Courier New', Courier, monospace; }
        .machine { background: #8b5a2b; padding: 40px; border: 8px solid #5d3a1a; border-radius: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); color: #f1e4d0; text-align: center; }
        h1 { margin-bottom: 30px; font-size: 1.5rem; text-shadow: 2px 2px #444; }
        .display { display: flex; gap: 25px; justify-content: center; margin-bottom: 30px; }
        .digit-box { background: #f1e4d0; color: #333; font-size: 3.5rem; padding: 15px; border-radius: 8px; border: 4px inset #8b5a2b; font-weight: bold; min-width: 60px; }
        .column { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        button { background: #cd7f32; border: none; padding: 12px 25px; color: white; font-weight: bold; border-radius: 6px; border-bottom: 5px solid #8b5a2b; cursor: pointer; transition: 0.1s; }
        button:active { transform: translateY(3px); border-bottom: 2px solid #8b5a2b; }
        .label { font-size: 0.9rem; text-transform: uppercase; opacity: 0.8; }
        .reset { margin-top: 20px; background: #a52a2a; border-bottom-color: #6d1a1a; }
    </style>
</head>
<body>
    <div class="machine">
        <h1>ЭВОЛЮЦИЯ: ПАСКАЛИНА</h1>
        <div class="display">
            <div class="column"><div class="digit-box" id="d2">0</div><button onclick="add(0)">+1</button><div class="label">Сотни</div></div>
            <div class="column"><div class="digit-box" id="d1">0</div><button onclick="add(1)">+1</button><div class="label">Десятки</div></div>
            <div class="column"><div class="digit-box" id="d0">0</div><button onclick="add(2)">+1</button><div class="label">Единицы</div></div>
        </div>
        <button class="reset" onclick="reset()">СБРОСИТЬ</button>
    </div>

    <script>
        let digits = [0, 0, 0];
        function add(pos) {
            digits[pos]++;
            if (digits[pos] > 9) {
                digits[pos] = 0;
                if (pos > 0) add(pos - 1); // Логика переноса в старший разряд
            }
            update();
        }
        function update() {
            document.getElementById('d2').innerText = digits[0];
            document.getElementById('d1').innerText = digits[1];
            document.getElementById('d0').innerText = digits[2];
        }
        function reset() { digits = [0, 0, 0]; update(); }
    </script>
</body>
</html>
